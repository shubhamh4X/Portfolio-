<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fenrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080914"/>
      <stop offset="50%" stop-color="#0d1024"/>
      <stop offset="100%" stop-color="#060712"/>
    </linearGradient>
    <linearGradient id="discordIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGradF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161936" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e1026" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="fenrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="gridF" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#252a56" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#fenrixBg)"/>
  <rect width="800" height="450" fill="url(#gridF)"/>

  <!-- Ambient Light Halos -->
  <circle cx="180" cy="150" r="160" fill="#5865F2" fill-opacity="0.12" filter="url(#fenrixGlow)"/>
  <circle cx="620" cy="220" r="170" fill="#06b6d4" fill-opacity="0.1" filter="url(#fenrixGlow)"/>
  <circle cx="400" cy="360" r="140" fill="#10b981" fill-opacity="0.08" filter="url(#fenrixGlow)"/>

  <!-- Top Application Bar -->
  <rect x="25" y="20" width="750" height="42" rx="8" fill="#0f1124" stroke="#252a56" stroke-width="1.2"/>
  <circle cx="45" cy="41" r="5" fill="#ef4444"/>
  <circle cx="62" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="41" r="5" fill="#10b981"/>
  <text x="105" y="45" fill="#a5b4fc" font-family="monospace" font-size="12">FenriX Daemon v2.4 ● Discord Gateway v10 WebSocket ● Shard #0 Connected</text>
  <rect x="625" y="28" width="135" height="26" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
  <text x="640" y="45" fill="#a5b4fc" font-family="monospace" font-weight="bold" font-size="11">● 18ms Event Loop</text>

  <!-- Left Card: Gateway & Inbound Event Stream -->
  <rect x="35" y="85" width="220" height="225" rx="10" fill="url(#cardGradF)" stroke="#252a56" stroke-width="1.2"/>
  <rect x="35" y="85" width="220" height="32" rx="10" fill="#141738" stroke="#252a56" stroke-width="1"/>
  <text x="50" y="106" fill="#818cf8" font-family="monospace" font-weight="bold" font-size="12">01. GATEWAY &amp; EVENTS</text>

  <rect x="50" y="130" width="190" height="40" rx="6" fill="#070919" stroke="#252a56" stroke-width="1"/>
  <text x="60" y="146" fill="#f9fafb" font-family="sans-serif" font-weight="600" font-size="11">WebSocket Ingestion</text>
  <text x="60" y="161" fill="#94a3b8" font-family="monospace" font-size="9.5">DISPATCH: MESSAGE_CREATE</text>

  <rect x="50" y="180" width="190" height="42" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="60" y="196" fill="#a5b4fc" font-family="sans-serif" font-weight="bold" font-size="11">Event Demuxer &amp; Rate Bucket</text>
  <text x="60" y="211" fill="#c7d2fe" font-family="monospace" font-size="9.5">Token Bucket: 5 req/sec cap</text>

  <rect x="50" y="232" width="190" height="38" rx="6" fill="#070919" stroke="#252a56" stroke-width="1"/>
  <text x="60" y="252" fill="#38bdf8" font-family="monospace" font-size="10">Guild Cache: In-Memory TTL</text>

  <!-- Connective Stream 1 -->
  <path d="M 255 198 L 290 198" stroke="url(#discordIndigo)" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="290,194 298,198 290,202" fill="#818cf8"/>

  <!-- Center Card: Heuristic Shield & Moderation Engine -->
  <rect x="290" y="75" width="220" height="245" rx="10" fill="url(#cardGradF)" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="290" y="75" width="220" height="34" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="305" y="97" fill="#c7d2fe" font-family="monospace" font-weight="bold" font-size="12">02. HEURISTIC SENTINEL</text>

  <rect x="305" y="122" width="190" height="44" rx="6" fill="#0c1033" stroke="#312e81" stroke-width="1"/>
  <text x="315" y="139" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11">Anti-Raid Sentinel</text>
  <text x="315" y="154" fill="#94a3b8" font-family="monospace" font-size="9.5">&gt;15 joins/10s → Auto-Quarantine</text>

  <rect x="305" y="176" width="190" height="44" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="315" y="193" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">Spam Regex &amp; Link Guard</text>
  <text x="315" y="208" fill="#a7f3d0" font-family="monospace" font-size="9.5">Malicious token distance &lt; 0.2</text>

  <rect x="305" y="230" width="190" height="40" rx="6" fill="#0c1033" stroke="#312e81" stroke-width="1"/>
  <text x="315" y="247" fill="#f87171" font-family="monospace" font-weight="600" font-size="10">Auto-Timeout &amp; Audit Log</text>
  <text x="315" y="261" fill="#94a3b8" font-family="monospace" font-size="9">Channel: #security-audit</text>

  <!-- Connective Stream 2 -->
  <path d="M 510 198 L 545 198" stroke="url(#discordIndigo)" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="545,194 553,198 545,202" fill="#06b6d4"/>

  <!-- Right Card: Modular Command Runtime & Plugins -->
  <rect x="545" y="85" width="220" height="225" rx="10" fill="url(#cardGradF)" stroke="#252a56" stroke-width="1.2"/>
  <rect x="545" y="85" width="220" height="32" rx="10" fill="#141738" stroke="#252a56" stroke-width="1"/>
  <text x="560" y="106" fill="#06b6d4" font-family="monospace" font-weight="bold" font-size="12">03. COMMAND RUNTIME</text>

  <rect x="560" y="130" width="190" height="40" rx="6" fill="#070919" stroke="#252a56" stroke-width="1"/>
  <text x="570" y="146" fill="#f9fafb" font-family="sans-serif" font-weight="600" font-size="11">Slash Command Router</text>
  <text x="570" y="161" fill="#94a3b8" font-family="monospace" font-size="9.5">/shield, /mute, /server-stats</text>

  <rect x="560" y="180" width="190" height="42" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <text x="570" y="196" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11">Role Hierarchy Guard</text>
  <text x="570" y="211" fill="#bae6fd" font-family="monospace" font-size="9.5">Enforces Bitwise Discord Permissions</text>

  <rect x="560" y="232" width="190" height="38" rx="6" fill="#070919" stroke="#252a56" stroke-width="1"/>
  <text x="570" y="252" fill="#a5b4fc" font-family="monospace" font-size="10">Hot-Reloadable Handlers (TS)</text>

  <!-- Bottom Architecture Context Banner -->
  <rect x="35" y="340" width="730" height="85" rx="8" fill="#0b0d1e" stroke="#1e2246" stroke-width="1"/>
  <path d="M 45 350 L 755 350" stroke="#1e2246" stroke-width="1"/>
  
  <text x="55" y="375" fill="#f1f5f9" font-family="sans-serif" font-weight="bold" font-size="12">FenriX Modular Discord Security &amp; Automation Architecture</text>
  <text x="55" y="396" fill="#94a3b8" font-family="sans-serif" font-size="11">Built on TypeScript &amp; Discord.js v14 with non-blocking event-driven pipeline, token-bucket rate limiting, anti-raid heuristics, and sub-20ms command execution.</text>

  <!-- Metric Badges Bottom Right -->
  <rect x="530" y="362" width="105" height="46" rx="6" fill="#141838" stroke="#312e81" stroke-width="1"/>
  <text x="542" y="380" fill="#a5b4fc" font-family="sans-serif" font-size="9.5" font-weight="600">AVG RESPONSE</text>
  <text x="542" y="400" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="14">18 ms</text>

  <rect x="645" y="362" width="105" height="46" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="657" y="380" fill="#a7f3d0" font-family="sans-serif" font-size="9.5" font-weight="600">UPTIME RECORD</text>
  <text x="657" y="400" fill="#34d399" font-family="monospace" font-weight="bold" font-size="14">99.98%</text>
</svg>
