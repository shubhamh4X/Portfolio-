<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ragBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172033" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f1524" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ragBgGrad)"/>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <!-- Ambient Glow -->
  <circle cx="180" cy="180" r="170" fill="#06b6d4" fill-opacity="0.08" filter="url(#glow2)"/>
  <circle cx="640" cy="220" r="180" fill="#10b981" fill-opacity="0.07" filter="url(#glow2)"/>

  <!-- Top System Header -->
  <rect x="25" y="20" width="750" height="42" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <circle cx="45" cy="41" r="5" fill="#ef4444"/>
  <circle cx="62" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="41" r="5" fill="#10b981"/>
  <text x="105" y="45" fill="#94a3b8" font-family="monospace" font-size="12">rag://knowledge-engine.internal/hybrid-evaluator · FastAPI + pgvector + Redis</text>
  <rect x="635" y="28" width="125" height="26" rx="4" fill="#083344" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="646" y="45" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="11">● Recall@K: 98.4%</text>

  <!-- Stage 1: Playwright + Self-Healing Agent -->
  <rect x="35" y="85" width="220" height="225" rx="10" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="35" y="85" width="220" height="32" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="106" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="12">01. INGESTION &amp; AGENT</text>

  <rect x="50" y="130" width="190" height="40" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="146" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="11">Playwright Headless Ingest</text>
  <text x="60" y="161" fill="#94a3b8" font-family="monospace" font-size="9.5">Dynamic JS &amp; DOM Tree Capture</text>

  <rect x="50" y="180" width="190" height="50" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <text x="60" y="197" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11">Self-Healing DOM Heuristic</text>
  <text x="60" y="211" fill="#7dd3fc" font-family="monospace" font-size="9.5">LLM proposes selector alternatives</text>
  <text x="60" y="223" fill="#bae6fd" font-family="monospace" font-size="9">Auto-recovers broken scrapers in &lt;1.2s</text>

  <rect x="50" y="238" width="190" height="32" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="258" fill="#10b981" font-family="monospace" font-size="9.5">✓ Schema Extraction Validated</text>

  <!-- Connective Arrow 1 -->
  <path d="M 255 198 L 290 198" stroke="url(#cyanEmerald)" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="290,194 298,198 290,202" fill="#10b981"/>

  <!-- Stage 2: Hybrid Retrieval Engine -->
  <rect x="298" y="85" width="235" height="225" rx="10" fill="url(#cardGrad2)" stroke="#06b6d4" stroke-width="1.4" stroke-opacity="0.6"/>
  <rect x="298" y="85" width="235" height="32" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="313" y="106" fill="#10b981" font-family="monospace" font-weight="bold" font-size="12">02. HYBRID RETRIEVAL</text>

  <rect x="313" y="130" width="205" height="42" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="325" y="146" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="11">Sparse Search: BM25</text>
  <text x="325" y="161" fill="#94a3b8" font-family="monospace" font-size="9.5">Exact keyword &amp; token term frequency</text>

  <rect x="313" y="180" width="205" height="42" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="325" y="196" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="11">Dense Vector: pgvector</text>
  <text x="325" y="211" fill="#38bdf8" font-family="monospace" font-size="9.5">HNSW index · Cosine distance ranking</text>

  <rect x="313" y="230" width="205" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <text x="325" y="246" fill="#34d399" font-family="monospace" font-size="10.5">Cross-Encoder Reranker</text>
  <text x="325" y="262" fill="#86efac" font-family="monospace" font-size="9">Reciprocal Rank Fusion · MRR: 0.94</text>

  <!-- Connective Arrow 2 -->
  <path d="M 533 198 L 568 198" stroke="url(#cyanEmerald)" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="568,194 576,198 568,202" fill="#6366f1"/>

  <!-- Stage 3: Attribution & LLM Synthesis -->
  <rect x="576" y="85" width="190" height="225" rx="10" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="576" y="85" width="190" height="32" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="591" y="106" fill="#818cf8" font-family="monospace" font-weight="bold" font-size="12">03. ATTRIBUTION &amp; EVAL</text>

  <rect x="591" y="130" width="160" height="40" rx="6" fill="#020617" stroke="#334155" stroke-width="1"/>
  <text x="601" y="146" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11">Citation Attributor</text>
  <text x="601" y="161" fill="#94a3b8" font-family="monospace" font-size="9.5">Strict source URI binding</text>

  <rect x="591" y="178" width="160" height="40" rx="6" fill="#020617" stroke="#334155" stroke-width="1"/>
  <text x="601" y="194" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11">Redis Query Cache</text>
  <text x="601" y="209" fill="#94a3b8" font-family="monospace" font-size="9.5">Sub-5ms response for hot keys</text>

  <rect x="591" y="226" width="160" height="44" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
  <text x="601" y="243" fill="#a5b4fc" font-family="monospace" font-weight="bold" font-size="11">Evaluation Suite</text>
  <text x="601" y="258" fill="#c7d2fe" font-family="monospace" font-size="9.5">Zero-Hallucination Guardrail</text>

  <!-- Bottom Metric Bar -->
  <rect x="35" y="328" width="731" height="98" rx="10" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>

  <g transform="translate(60, 345)">
    <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10.5">RETRIEVAL ACCURACY</text>
    <text x="0" y="44" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="24">Hybrid BM25</text>
    <text x="0" y="62" fill="#94a3b8" font-family="monospace" font-size="9.5">+ pgvector HNSW embeddings</text>
  </g>

  <line x1="225" y1="342" x2="225" y2="412" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(250, 345)">
    <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10.5">SCRAPER RESILIENCE</text>
    <text x="0" y="44" fill="#10b981" font-family="sans-serif" font-weight="800" font-size="24">Self-Healing</text>
    <text x="0" y="62" fill="#94a3b8" font-family="monospace" font-size="9.5">Dynamic DOM selector recovery</text>
  </g>

  <line x1="415" y1="342" x2="415" y2="412" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(440, 345)">
    <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10.5">EVALUATION METRICS</text>
    <text x="0" y="44" fill="#f59e0b" font-family="sans-serif" font-weight="800" font-size="24">Recall@K &amp; MRR</text>
    <text x="0" y="62" fill="#94a3b8" font-family="monospace" font-size="9.5">Measures latency, citations &amp; cost</text>
  </g>

  <line x1="605" y1="342" x2="605" y2="412" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(630, 345)">
    <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10.5">SYSTEM RUNTIME</text>
    <text x="0" y="44" fill="#a78bfa" font-family="sans-serif" font-weight="800" font-size="24">FastAPI</text>
    <text x="0" y="62" fill="#94a3b8" font-family="monospace" font-size="9.5">Dockerized + CI/CD automated</text>
  </g>

</svg>
