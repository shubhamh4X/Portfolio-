<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e131f" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing Accent Lines & Atmospheric Light -->
  <circle cx="200" cy="120" r="160" fill="#10b981" fill-opacity="0.07" filter="url(#glow)"/>
  <circle cx="620" cy="300" r="180" fill="#06b6d4" fill-opacity="0.06" filter="url(#glow)"/>

  <!-- Top Navigation / Header Bar -->
  <rect x="25" y="20" width="750" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="45" cy="41" r="5" fill="#ef4444"/>
  <circle cx="62" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="41" r="5" fill="#10b981"/>
  <text x="105" y="45" fill="#9ca3af" font-family="monospace" font-size="12">ws://telemetry.shubham.internal/api/v1/chat-gateway (STOMP over WebSocket)</text>
  <rect x="630" y="28" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <text x="645" y="45" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11">● 100K Sockets OK</text>

  <!-- Left Architecture Block: Client Ingestion & Handshake -->
  <rect x="35" y="85" width="220" height="225" rx="10" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="35" y="85" width="220" height="32" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="50" y="106" fill="#34d399" font-family="monospace" font-weight="bold" font-size="12">01. INGESTION &amp; AUTH</text>
  
  <rect x="50" y="130" width="190" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="146" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11">JWT Handshake Interceptor</text>
  <text x="60" y="160" fill="#94a3b8" font-family="monospace" font-size="9.5">HMAC-SHA256 Stateless Check (&lt;2ms)</text>

  <rect x="50" y="178" width="190" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="194" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11">STOMP Protocol Broker</text>
  <text x="60" y="208" fill="#94a3b8" font-family="monospace" font-size="9.5">/app/chat.send · /topic/group.{id}</text>

  <rect x="50" y="226" width="190" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="242" fill="#38bdf8" font-family="monospace" font-size="10">typing: true · receipt: READ</text>
  <text x="60" y="258" fill="#64748b" font-family="monospace" font-size="9">ACK: 0x9f4a21 · In-flight: 0</text>

  <!-- Connective Data Streams -->
  <path d="M 255 198 L 290 198" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="290,194 298,198 290,202" fill="#06b6d4"/>

  <!-- Center Architecture Block: Async Fan-Out Engine -->
  <rect x="298" y="85" width="235" height="225" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4" stroke-opacity="0.6"/>
  <rect x="298" y="85" width="235" height="32" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="313" y="106" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="12">02. SPRING BOOT CORE</text>

  <rect x="313" y="130" width="205" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="325" y="146" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="11">ThreadPoolTaskExecutor</text>
  <text x="325" y="161" fill="#10b981" font-family="monospace" font-size="9.5">CorePool: 16 · MaxPool: 64 · Zero-Drop</text>

  <rect x="313" y="180" width="205" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="325" y="196" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="11">Group Fan-Out Dispatcher</text>
  <text x="325" y="211" fill="#38bdf8" font-family="monospace" font-size="9.5">Concurrent Subscriptions Dispatch</text>

  <rect x="313" y="230" width="205" height="44" rx="6" fill="#052e16" stroke="#10b981" stroke-width="0.8"/>
  <text x="325" y="246" fill="#34d399" font-family="monospace" font-size="10.5">LATENCY: 14.8 ms (P99)</text>
  <text x="325" y="262" fill="#86efac" font-family="monospace" font-size="9">Throughput: 8,420 msgs/sec</text>

  <!-- Connective Data Streams -->
  <path d="M 533 198 L 568 198" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="568,194 576,198 568,202" fill="#3b82f6"/>

  <!-- Right Architecture Block: Persistence & Containerization -->
  <rect x="576" y="85" width="190" height="225" rx="10" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="576" y="85" width="190" height="32" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="591" y="106" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="12">03. PERSISTENCE &amp; OPS</text>

  <rect x="591" y="130" width="160" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="601" y="146" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11">MySQL Chat Archive</text>
  <text x="601" y="160" fill="#94a3b8" font-family="monospace" font-size="9.5">Indexed by (room_id, created)</text>

  <rect x="591" y="178" width="160" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="601" y="194" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11">Receipt State Machine</text>
  <text x="601" y="208" fill="#94a3b8" font-family="monospace" font-size="9.5">SENT → DELIVERED → READ</text>

  <rect x="591" y="226" width="160" height="42" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="601" y="243" fill="#60a5fa" font-family="monospace" font-weight="bold" font-size="11">Docker Containerized</text>
  <text x="601" y="258" fill="#93c5fd" font-family="monospace" font-size="9.5">Alpine JRE · Multi-stage build</text>

  <!-- Bottom Metric Ribbon -->
  <rect x="35" y="328" width="731" height="98" rx="10" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
  
  <g transform="translate(60, 345)">
    <text x="0" y="16" fill="#6b7280" font-family="monospace" font-size="10.5">SOCKET TRANSIT P99</text>
    <text x="0" y="44" fill="#10b981" font-family="sans-serif" font-weight="800" font-size="24">&lt; 20 ms</text>
    <text x="0" y="62" fill="#9ca3af" font-family="monospace" font-size="9.5">Guaranteed ordered delivery</text>
  </g>

  <line x1="225" y1="342" x2="225" y2="412" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(250, 345)">
    <text x="0" y="16" fill="#6b7280" font-family="monospace" font-size="10.5">JWT SECURITY FILTER</text>
    <text x="0" y="44" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="24">&lt; 2 ms</text>
    <text x="0" y="62" fill="#9ca3af" font-family="monospace" font-size="9.5">Stateless interceptor verification</text>
  </g>

  <line x1="415" y1="342" x2="415" y2="412" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(440, 345)">
    <text x="0" y="16" fill="#6b7280" font-family="monospace" font-size="10.5">DELIVERY STATE TRACKING</text>
    <text x="0" y="44" fill="#f59e0b" font-family="sans-serif" font-weight="800" font-size="24">100%</text>
    <text x="0" y="62" fill="#9ca3af" font-family="monospace" font-size="9.5">Double-tick receipt transitions</text>
  </g>

  <line x1="605" y1="342" x2="605" y2="412" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(630, 345)">
    <text x="0" y="16" fill="#6b7280" font-family="monospace" font-size="10.5">DEPLOYMENT RUNTIME</text>
    <text x="0" y="44" fill="#a78bfa" font-family="sans-serif" font-weight="800" font-size="24">Docker</text>
    <text x="0" y="62" fill="#9ca3af" font-family="monospace" font-size="9.5">Production-grade isolated image</text>
  </g>

</svg>
